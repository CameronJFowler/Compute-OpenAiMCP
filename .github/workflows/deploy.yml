# Build and publish to GitHub Pages.
#
# Here because deploying should not require signing up for anything. The repo
# already exists, so this turns a live HTTPS URL into a single settings toggle:
# Settings -> Pages -> Source: GitHub Actions.
#
# The tests run before the build, so a deployment is also public evidence that
# the suite passes.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; finish the newest, drop the rest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npx tsc --noEmit
          npm test

      - name: Build
        run: npx vite build
        env:
          # A project site is served from /<repo>/, not from the domain root.
          DEPLOY_BASE: /Compute-OpenAiMCP/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
