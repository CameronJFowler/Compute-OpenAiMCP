<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="ui-monospace, monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="bold">Compute — How WebMCP connects an agent to a live research workspace</text>

  <!-- ── Agent box ── -->
  <rect x="30" y="60" width="160" height="100" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="82" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">AI AGENT</text>
  <text x="110" y="100" text-anchor="middle" fill="#94a3b8" font-size="10">(ChatGPT, Claude, etc.)</text>
  <text x="110" y="118" text-anchor="middle" fill="#64748b" font-size="9">asks research questions</text>
  <text x="110" y="133" text-anchor="middle" fill="#64748b" font-size="9">receives tool results</text>
  <text x="110" y="148" text-anchor="middle" fill="#64748b" font-size="9">≤ 1 500 chars per call</text>

  <!-- ── WebMCP protocol ── -->
  <rect x="240" y="60" width="160" height="100" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="320" y="82" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">WebMCP</text>
  <text x="320" y="100" text-anchor="middle" fill="#94a3b8" font-size="10">in-browser protocol</text>
  <text x="320" y="118" text-anchor="middle" fill="#64748b" font-size="9">tool registry (dynamic)</text>
  <text x="320" y="133" text-anchor="middle" fill="#64748b" font-size="9">schema from live state</text>
  <text x="320" y="148" text-anchor="middle" fill="#64748b" font-size="9">4 → 12 → 13 → 14 tools</text>

  <!-- ── Browser page / tools ── -->
  <rect x="450" y="48" width="380" height="360" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="450" y="48" width="380" height="24" rx="8" fill="#1e293b"/>
  <text x="640" y="64" text-anchor="middle" fill="#94a3b8" font-size="10">computeopenai.netlify.app</text>

  <!-- Tool layer -->
  <rect x="466" y="84" width="170" height="200" rx="6" fill="#1e293b" stroke="#374151" stroke-width="1"/>
  <text x="551" y="102" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="bold">TOOL LAYER</text>
  <text x="551" y="118" text-anchor="middle" fill="#64748b" font-size="9">list_datasets</text>
  <text x="551" y="132" text-anchor="middle" fill="#64748b" font-size="9">load_dataset</text>
  <text x="551" y="146" text-anchor="middle" fill="#64748b" font-size="9">run_regression (HAC)</text>
  <text x="551" y="160" text-anchor="middle" fill="#64748b" font-size="9">hypothesis_test (BH adj.)</text>
  <text x="551" y="174" text-anchor="middle" fill="#64748b" font-size="9">add_feature</text>
  <text x="551" y="188" text-anchor="middle" fill="#64748b" font-size="9">run_backtest</text>
  <text x="551" y="202" text-anchor="middle" fill="#64748b" font-size="9">bootstrap_strategy</text>
  <text x="551" y="216" text-anchor="middle" fill="#64748b" font-size="9">record_finding ★</text>
  <text x="551" y="232" text-anchor="middle" fill="#64748b" font-size="9">build_report</text>
  <text x="551" y="252" text-anchor="middle" fill="#475569" font-size="8" font-style="italic">★ refuses uncited claims</text>
  <text x="551" y="266" text-anchor="middle" fill="#475569" font-size="8" font-style="italic">  checks the run log</text>

  <!-- Workspace store -->
  <rect x="648" y="84" width="168" height="100" rx="6" fill="#1e293b" stroke="#374151" stroke-width="1"/>
  <text x="732" y="102" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="bold">WORKSPACE</text>
  <text x="732" y="118" text-anchor="middle" fill="#64748b" font-size="9">hypothesis (editable)</text>
  <text x="732" y="132" text-anchor="middle" fill="#64748b" font-size="9">sample window (draggable)</text>
  <text x="732" y="146" text-anchor="middle" fill="#64748b" font-size="9">loaded dataset</text>
  <text x="732" y="160" text-anchor="middle" fill="#64748b" font-size="9">session run log</text>
  <text x="732" y="174" text-anchor="middle" fill="#475569" font-size="8" font-style="italic">one copy shared by agent + human</text>

  <!-- Chart / UI -->
  <rect x="648" y="196" width="168" height="140" rx="6" fill="#1e293b" stroke="#374151" stroke-width="1"/>
  <text x="732" y="214" text-anchor="middle" fill="#f9a8d4" font-size="10" font-weight="bold">CHART + UI</text>
  <!-- Mini chart sparkline -->
  <polyline points="662,270 676,250 690,265 704,238 718,255 732,242 746,258 760,234 774,248 800,240" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="732" y="300" text-anchor="middle" fill="#64748b" font-size="9">full series renders here</text>
  <text x="732" y="314" text-anchor="middle" fill="#64748b" font-size="9">never sent to agent</text>
  <text x="732" y="330" text-anchor="middle" fill="#475569" font-size="8" font-style="italic">approval card on large bootstrap</text>

  <!-- Human -->
  <rect x="648" y="348" width="168" height="50" rx="6" fill="#1e293b" stroke="#374151" stroke-width="1"/>
  <text x="732" y="368" text-anchor="middle" fill="#94a3b8" font-size="10">HUMAN IN THE LOOP</text>
  <text x="732" y="384" text-anchor="middle" fill="#64748b" font-size="9">watches charts · approves gates</text>
  <text x="732" y="396" text-anchor="middle" fill="#64748b" font-size="9">edits hypothesis mid-session</text>

  <!-- ── Arrows ── -->
  <!-- Agent → WebMCP: tool call -->
  <line x1="192" y1="100" x2="236" y2="100" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="214" y="93" text-anchor="middle" fill="#6b7280" font-size="8">tool call</text>

  <!-- WebMCP → Agent: result -->
  <line x1="236" y1="118" x2="192" y2="118" stroke="#10b981" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <text x="214" y="134" text-anchor="middle" fill="#10b981" font-size="8">result ≤1500c</text>

  <!-- WebMCP ↔ Tool layer -->
  <line x1="402" y1="95" x2="462" y2="140" stroke="#8b5cf6" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="462" y1="120" x2="402" y2="112" stroke="#10b981" stroke-width="1.2" marker-end="url(#arrow-green)"/>

  <!-- Tool layer → Workspace (reads/writes) -->
  <line x1="638" y1="130" x2="646" y2="130" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="642" y="122" text-anchor="middle" fill="#6b7280" font-size="7">r/w</text>

  <!-- Tool layer → Chart (pushes series) -->
  <line x1="636" y1="200" x2="646" y2="230" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  <text x="618" y="222" text-anchor="middle" fill="#3b82f6" font-size="8">full series</text>

  <!-- Human ↔ Workspace -->
  <line x1="732" y1="348" x2="732" y2="340" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

  <!-- ── Dataset label ── -->
  <rect x="466" y="296" width="170" height="100" rx="6" fill="#1e293b" stroke="#374151" stroke-width="1"/>
  <text x="551" y="314" text-anchor="middle" fill="#fb923c" font-size="10" font-weight="bold">BUNDLED DATASETS</text>
  <text x="551" y="330" text-anchor="middle" fill="#64748b" font-size="9">🌡 Climate (annual temp + CO₂)</text>
  <text x="551" y="344" text-anchor="middle" fill="#64748b" font-size="9">🐧 Biology (Palmer penguins)</text>
  <text x="551" y="358" text-anchor="middle" fill="#64748b" font-size="9">🔭 Astronomy (Hubble 1929)</text>
  <text x="551" y="372" text-anchor="middle" fill="#64748b" font-size="9">📈 Finance (FF industry returns)</text>
  <text x="551" y="386" text-anchor="middle" fill="#475569" font-size="8" font-style="italic">static CSV — no network at runtime</text>

  <!-- ── Bottom legend ── -->
  <text x="430" y="440" text-anchor="middle" fill="#475569" font-size="10">Multiple-testing counter live in header — adjusted α shown to agent and human simultaneously</text>
  <text x="430" y="456" text-anchor="middle" fill="#475569" font-size="10">Tool schemas rebuild on dataset load — agent can only name columns that exist</text>

</svg>
